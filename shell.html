<title>Falak Hesab – online accounting for small businesses and travel agencies</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Manrope:wght@400;500;600;700&family=Vazirmatn:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;600&display=swap">
<style>
/* Layout: navy ledger-book spine on the left (modules), working sheet on the right. */
:root{
  --bg:#eef4f8; --surface:#ffffff; --sunk:#f5f9fb; --fg:#0d2236; --muted:#4a5f73; --line:#d3e0e9;
  --nav:#12345c; --nav-2:#1d4f80; --nav-fg:#c9d7e3; --nav-hi:#ffffff; --nav-sel:rgba(255,255,255,.08); --star:#f6ecd2;
  --accent:#d6a84a; --gold-ink:#8f6a1c; --primary:#137070; --primary-ink:#ffffff; --pos:#1b8a4c; --neg:#c03535; --warn:#8f6a1c; --warnbg:#fbf3df;
  --display:"Marcellus","Iowan Old Style",Georgia,serif; --body:"Manrope","Segoe UI",system-ui,sans-serif; --mono:"Manrope","Segoe UI",system-ui,sans-serif;
  --r:14px; --shadow:0 1px 2px rgba(13,34,54,.05),0 8px 24px -18px rgba(13,34,54,.25);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#07111d; --surface:#0e1f31; --sunk:#11263b; --fg:#e5edf3; --muted:#93a7b9; --line:#1f3a52;
  --nav:#061224; --nav-2:#0e2c4d; --nav-fg:#a9bccd; --nav-hi:#ffffff; --nav-sel:rgba(255,255,255,.07);
  --accent:#e3bb63; --gold-ink:#e3bb63; --primary:#4cbdb6; --primary-ink:#06222a; --pos:#3cc97a; --neg:#f2796d; --warn:#e3bb63; --warnbg:#2a2312; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#07111d; --surface:#0e1f31; --sunk:#11263b; --fg:#e5edf3; --muted:#93a7b9; --line:#1f3a52;
  --nav:#061224; --nav-2:#0e2c4d; --nav-fg:#a9bccd; --nav-hi:#ffffff; --nav-sel:rgba(255,255,255,.07);
  --accent:#e3bb63; --gold-ink:#e3bb63; --primary:#4cbdb6; --primary-ink:#06222a; --pos:#3cc97a; --neg:#f2796d; --warn:#e3bb63; --warnbg:#2a2312; color-scheme:dark}
*{box-sizing:border-box}
:root[dir="rtl"]{--body:"Vazirmatn","Noto Sans Arabic","Segoe UI",Tahoma,sans-serif;--display:"Vazirmatn","Noto Sans Arabic","Segoe UI",Tahoma,sans-serif}
html[dir="rtl"] .num,html[dir="rtl"] th.num{text-align:left}
th.num{font-family:var(--body)}
.num,input.num,.kv dd,.mono{direction:ltr;unicode-bidi:isolate}
html[dir="rtl"] .totals b{text-align:left}
html[dir="rtl"] input.num{text-align:left}
.langsel{background:transparent;color:inherit;border-color:currentColor;opacity:.85;max-width:160px;font-size:13px;padding:5px 8px}
.side .langsel{color:var(--nav-hi);border-color:var(--nav-sel);background:var(--nav)}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.55 var(--body);-webkit-font-smoothing:antialiased}
a{color:var(--primary);text-decoration:none}
a:hover{text-decoration:underline}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100%}
.sky{background:
  radial-gradient(1.2px 1.2px at 18% 12%,var(--star) 50%,transparent 52%),radial-gradient(1px 1px at 72% 6%,var(--star) 50%,transparent 52%),
  radial-gradient(1px 1px at 40% 28%,var(--star) 50%,transparent 52%),radial-gradient(1.4px 1.4px at 86% 34%,var(--star) 50%,transparent 52%),
  radial-gradient(1px 1px at 10% 52%,var(--star) 50%,transparent 52%),radial-gradient(1px 1px at 60% 66%,var(--star) 50%,transparent 52%),
  radial-gradient(1.2px 1.2px at 28% 84%,var(--star) 50%,transparent 52%),radial-gradient(1px 1px at 90% 90%,var(--star) 50%,transparent 52%),
  radial-gradient(600px 260px at 50% 108%,rgba(214,168,74,.22),transparent 70%),
  linear-gradient(180deg,var(--nav) 0%,var(--nav-2) 100%)}
.side{color:var(--nav-fg);display:flex;flex-direction:column;padding-block:18px;padding-left:max(0px,env(safe-area-inset-left,0px));border-inline-end:1px solid rgba(214,168,74,.2)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 18px 16px;color:var(--nav-hi);font:400 22px var(--display);letter-spacing:.03em}
.brand .mark{flex:none;background:#fff;border-radius:11px;padding:3px 5px;display:grid;place-items:center;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.brand .mark img{width:36px;height:auto;display:block}
.brand .lg{display:flex;align-items:center;gap:10px}
.brand small{display:block;font:600 10.5px var(--body);color:var(--accent);letter-spacing:.12em;text-transform:uppercase;margin-top:2px}
.navgroup{padding:14px 22px 4px;font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.side nav a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 12px;margin:1px 10px;border-radius:9px;color:var(--nav-fg)}
.side nav a:hover{background:var(--nav-sel);color:var(--nav-hi);text-decoration:none}
.side nav a.on{background:rgba(214,168,74,.16);color:#f3cf7e;font-weight:600}
.side nav a.custom{margin-top:14px;font-size:12.5px;opacity:.85;border:1px dashed rgba(214,168,74,.35)}
.side nav a.custom:hover{opacity:1}
.custgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;align-items:start}
.custrow{padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.custrow:last-child{border-bottom:0}
.custrow span:not(.tag){flex:1}
.side nav a span.n{font:600 11px var(--mono);opacity:.6;font-variant-numeric:tabular-nums}
.side .foot{margin-top:auto;padding:16px 20px 0;font-size:12px;opacity:.8;display:flex;flex-direction:column;gap:6px}
.side .foot a{color:var(--nav-hi)}
.btn.menu-btn{display:none;background:transparent;color:var(--nav-hi);border-color:var(--nav-sel)}
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));background:color-mix(in srgb,var(--surface) 92%,transparent);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top .biz{font:700 15px var(--body);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .biz small{display:block;font:400 12px var(--body);color:var(--muted)}
.top .right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.online{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.online i{width:8px;height:8px;border-radius:50%;background:var(--pos);display:inline-block}
.who{font-size:12px;color:var(--muted);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.content{padding-block:22px 48px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));max-width:1240px;width:100%}
.banner{background:var(--warnbg);color:var(--fg);font-size:13px;padding-block:8px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
h1{font:400 27px/1.2 var(--display);margin:0;letter-spacing:.01em;text-wrap:balance}
html[dir="rtl"] h1{font-weight:700;font-size:24px}
h2{font:700 15px var(--body);margin:0 0 10px}
.head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.head .tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card.scroll,.card>.scroll{border-radius:var(--r)}
.pad{padding:18px}
.stack{display:flex;flex-direction:column;gap:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:600 13px var(--body);padding:8px 15px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--primary);text-decoration:none}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--neg)}
.btn.danger:hover{border-color:var(--neg)}
.btn.ghost{background:transparent}
.btn.sm{padding:4px 10px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:14px var(--body);color:var(--fg);background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:8px 11px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 20%,transparent);background:var(--surface)}
input[type=checkbox]{accent-color:var(--primary)}
input[type=checkbox]{width:auto}
input:disabled,select:disabled,textarea:disabled{background:var(--sunk);color:var(--muted)}
textarea{min-height:70px}
textarea.code{font:12px ui-monospace,Menlo,Consolas,monospace;min-height:140px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted);font-weight:600}
label.c{display:flex;align-items:center;gap:8px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.span2{grid-column:1/-1}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-weight:700;font-size:11.5px;letter-spacing:.02em;color:var(--muted);text-align:start;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--sunk)}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--sunk)}
.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.mono,.kv dd,.totals b{font-variant-numeric:tabular-nums}
input.num{text-align:right}
.neg{color:var(--neg)}
.muted{color:var(--muted)}
.mono{font-family:var(--mono)}
.small{font-size:12px}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:1px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.bank,.tag.due{color:var(--primary);border-color:var(--primary)}
.tag.cash,.tag.warn{color:var(--warn);border-color:var(--warn)}
.tag.paid{color:var(--pos);border-color:var(--pos)}
.tag.overdue{color:var(--neg);border-color:var(--neg)}
.lines{margin-top:16px}
.lines table{min-width:640px}
.lines td{padding:6px 5px}
.lines th{padding:8px 5px}
.lines td.calc{padding-top:13px}
.x{border:0;background:none;color:var(--muted);font-size:18px;cursor:pointer;padding:4px 8px}
.x:hover{color:var(--neg)}
.tot td{font-weight:600;border-bottom:0;background:var(--sunk)}
.totals{display:grid;grid-template-columns:auto 140px;gap:4px 18px;justify-content:end;margin-top:12px}
.totals b{font-family:var(--mono);text-align:right}
.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;margin-top:18px}
.actions div{display:flex;gap:8px;flex-wrap:wrap}
.meta{font-size:12px;color:var(--muted);margin-top:12px}
.sheet{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:18px;align-items:start}
.sheet h2{padding:14px 18px 0}
.sec{display:flex;justify-content:space-between;padding:12px 18px 4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
td.sec{display:table-cell;background:var(--surface)}
.row{display:flex;justify-content:space-between;gap:12px;padding-block:5px;padding-inline:30px 18px;cursor:pointer}
.row:hover{background:var(--sunk)}
.row.sub{font-weight:600;cursor:default;border-top:1px solid var(--line);margin-top:4px;padding-inline-start:18px}
.row.sub:hover{background:none}
.row.grand{font-weight:600;cursor:default;background:var(--sunk);padding:10px 18px;border-top:2px solid var(--fg);margin-top:8px}
.period{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.period label{width:150px}
.empty{padding:36px 18px;text-align:center;color:var(--muted)}
.note{background:var(--warnbg);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:14px}
.ok{color:var(--pos)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.tile{padding:16px 18px;display:flex;flex-direction:column;gap:4px;cursor:pointer}
.tile:hover{border-color:var(--primary);text-decoration:none}
.tile b{font:700 15px var(--body);color:var(--fg)}
.tile span{color:var(--muted);font-size:13px}
.doc{max-width:820px;padding:36px}
.doc .dh{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:2px solid var(--accent);padding-bottom:14px;margin-bottom:18px}
.doc .dt{font:400 26px var(--display);letter-spacing:.06em;color:var(--gold-ink);text-align:end}
.xbox,.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;margin-top:16px}
.sgrid{margin-top:0;align-items:start}
.xbox .card{background:var(--sunk);box-shadow:none}
.kpis,.kpis2{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.kpi .num{display:block;text-align:start;font:700 26px/1.2 var(--body);font-variant-numeric:tabular-nums lining-nums;margin-top:6px;color:var(--fg)}
.kpi .num.neg{color:var(--neg)}
.alertkpi,.alertkpi:hover,.alertkpi *{text-decoration:none!important;color:inherit;display:block}.alertkpi .num.neg{color:var(--neg)}.alertkpi:hover{border-color:var(--accent)}.alertkpi.warn{border-inline-start:4px solid var(--neg)}
.doclogo{display:block;max-height:72px;max-width:220px;margin-bottom:8px}
.docfoot{margin-top:28px;padding-top:12px;border-top:1px solid var(--line);color:var(--muted);font-size:12.5px;display:grid;gap:10px}
.docfoot div{white-space:pre-line}
.logobox{width:240px;height:110px;border:1px dashed var(--line);border-radius:12px;display:grid;place-items:center;background:var(--sunk);padding:8px}
.logobox img{max-width:224px;max-height:94px;width:auto;height:auto;object-fit:contain;display:block}
.ftitem{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;background:var(--sunk)}
.doc .parties{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:18px}
.kv{display:grid;grid-template-columns:auto auto;gap:3px 16px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-family:var(--mono)}
.sig{display:flex;justify-content:space-between;gap:24px;margin-top:48px;color:var(--muted);font-size:12px}
.sig div{border-top:1px solid var(--line);padding-top:6px;flex:1}
.search{max-width:220px}
.perm{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px 14px;margin-top:6px}
/* auth */
#authView{min-height:100%;background:var(--nav)}
.authwrap{position:relative;overflow:hidden}
.authsky{background:
  radial-gradient(1.4px 1.4px at 12% 18%,var(--star) 50%,transparent 52%),radial-gradient(1px 1px at 30% 8%,var(--star) 50%,transparent 52%),radial-gradient(1.2px 1.2px at 52% 22%,var(--star) 50%,transparent 52%),
  radial-gradient(1px 1px at 68% 12%,var(--star) 50%,transparent 52%),radial-gradient(1.6px 1.6px at 80% 30%,var(--star) 50%,transparent 52%),radial-gradient(1px 1px at 92% 52%,var(--star) 50%,transparent 52%),
  radial-gradient(1.2px 1.2px at 6% 60%,var(--star) 50%,transparent 52%),radial-gradient(1px 1px at 22% 44%,var(--star) 50%,transparent 52%),radial-gradient(1px 1px at 88% 72%,var(--star) 50%,transparent 52%),
  radial-gradient(900px 320px at 50% 112%,rgba(246,214,150,.45),transparent 65%),radial-gradient(1200px 500px at 85% 115%,rgba(120,190,205,.5),transparent 60%),
  linear-gradient(180deg,#163f6e 0%,#2b6a9b 60%,#5a9fb6 100%)}
.authwrap .moon{position:absolute;inset-block-start:7%;inset-inline-end:9%;width:clamp(64px,10vw,120px);opacity:.95;pointer-events:none}
.authwrap .tagline{position:relative;color:#e1ebf3;text-align:center;max-width:420px;margin:0 auto 18px;font-size:15px}
.authwrap .tagline b{display:block;font:400 30px/1.2 var(--display);color:#fff;margin-bottom:6px}
html[dir="rtl"] .authwrap .tagline b{font-weight:700}
#authView.sharedwrap{background:var(--bg)}
.authcard h1{margin-bottom:12px}
.authwrap{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.authcard{position:relative;width:100%;max-width:410px;padding:30px;border-radius:20px;border:1px solid rgba(214,168,74,.3);box-shadow:0 30px 60px -20px rgba(0,0,0,.55)}
.authcard .brand{color:var(--fg);padding:0 0 18px}
.authcard .brand .mark{box-shadow:none;border:1px solid var(--line)}
.authcard .btn.primary{padding:11px 15px;font-size:14px}
.authcard .wsbrand{flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;padding:0 0 20px;margin-bottom:18px;border-bottom:1px solid var(--line)}
.wslogo{max-width:220px;max-height:84px;width:auto;height:auto;object-fit:contain;display:block}
.wsinit{width:62px;height:62px;border-radius:16px;display:grid;place-items:center;background:var(--nav);color:var(--accent);font:400 30px var(--display)}
.wsname{font:400 22px var(--display);letter-spacing:.02em;color:var(--fg);line-height:1.2}
.wsaddr{font-size:11.5px;color:var(--muted);letter-spacing:0;font-family:var(--body)}
.wspow{text-align:center;margin:14px 0 0}
.wslink{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.wslink .mono{background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:6px 10px;word-break:break-all}
.wsin{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);margin-top:6px}
.wsin span{padding:9px 10px;background:var(--bg);color:var(--muted);border-right:1px solid var(--line);white-space:nowrap;font-size:13px;display:flex;align-items:center}
.wsin input{border:0!important;border-radius:0!important;background:var(--sunk);flex:1;min-width:0;margin:0!important;box-shadow:none!important}
[dir=rtl] .wsin{direction:ltr}
.banner.planban{background:color-mix(in srgb,var(--primary) 10%,var(--surface))}
.banner.planend{background:color-mix(in srgb,var(--neg) 12%,var(--surface))}
.banner a{font-weight:600;margin-inline-start:6px}
.planhead{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}
.kv2{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.plancard{display:flex;flex-direction:column;gap:10px}
.plancard.best{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),var(--shadow)}
.plancard.cur{border-color:var(--primary)}
.plantop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.plantop h2{margin:0}
.price{font:600 30px var(--body);color:var(--fg)}
.planlist{margin:0;padding-inline-start:18px;line-height:1.7;color:var(--muted);flex:1}
.plancard .btn{width:100%;justify-content:center}
.planpanel{margin-top:14px;background:var(--sunk)}
details summary{cursor:pointer}
.planpick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.pp{position:relative;cursor:pointer}
.pp input{position:absolute;opacity:0;pointer-events:none}
.ppb{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--sunk);height:100%}
.ppb b{font-size:14px}.ppp{font-size:13px;color:var(--fg)}.ppt{font-size:11px;color:var(--muted)}
.pp input:checked+.ppb{border-color:var(--primary);box-shadow:0 0 0 2px color-mix(in srgb,var(--primary) 35%,transparent);background:var(--surface)}
.pp input:focus-visible+.ppb{outline:2px solid var(--accent);outline-offset:2px}
.ppf{margin:0 0 12px;padding-inline-start:18px;font-size:12.5px;color:var(--muted);line-height:1.6}
